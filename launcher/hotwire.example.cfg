# ==[ H O T W I R E ]===================================================
#  hotwire.cfg -- your server's settings, read by hotwire.bat or hotwire.sh
#
#  One setting per line: a name, a space, then the value. Put a value
#  with spaces in "double quotes", and never use a double quote inside
#  one. A line starting with # is a comment. An empty value, or a
#  setting that is off (#), leaves the game's default.
#
#  This file is only read, never run. A line that is not a setting is
#  ignored, and "hotwire.bat check" or "./hotwire.sh check" says which.
#  The RCON password is in hotwire-secrets.cfg, never here.
#
#  To run your own commands before every start, or after an update, see
#  hotwire-before.example.bat / .sh and hotwire-after.example.bat / .sh.
# ======================================================================

# ----------------------------------------------------------------------
#  1. YOUR SERVER
# ----------------------------------------------------------------------

#  The name in the server browser.
#                                         [default: My Untitled Rust Server]
server.hostname             ""

#  Shown with your server in the browser. \n starts a new line.
#                        [default: No server description has been provided.]
server.description          ""

#  Browser filter tags, separated by commas, with no spaces. For example:
#  monthly,vanilla,NA
#    wipe schedule   monthly, biweekly, weekly
#    ruleset         vanilla, softcore, hardcore, primitive, pve
#    style           roleplay, creative, minigame, training, battlefield,
#                    builds
#    region          a region tag, such as NA or EU
server.tags                 ""

#  Player slots.
#                                                             [default: 500]
server.maxplayers           ""

#  The folder under server/ that holds the map, blueprints and bans. Short,
#  lower case, no spaces. Changing it starts a new, empty server and leaves
#  the old one on disk.
#                                              [default: my_server_identity]
server.identity             ""

#  The map: any whole number from 0 to 2147483647. Changing it wipes the
#  map.
#                                                            [default: 1337]
server.seed                 ""

#  Map width in meters, 1000 to 6000. Bigger maps boot slower and use more
#  memory. Changing it wipes the map.
#                                                            [default: 4500]
server.worldsize            ""

# ----------------------------------------------------------------------
#  2. PORTS
#     Forward the game and query ports at your router, and nothing else. Each
#     server on this machine needs its own three.
# ----------------------------------------------------------------------

#  Game traffic, UDP.
#                                                           [default: 28015]
server.port                 28015

#  Server browser, UDP. If this is wrong the server runs but nobody can see
#  it. Never 27000 to 27030, which is Steam's own range: on a machine that
#  also runs Steam, the client can take the port and hide your server.
#                                                               [default: 0]
server.queryport            28017

#  Remote console, TCP. Never forward this port: RCON is not encrypted, and
#  the password crosses the network in plain text.
#                                                               [default: 0]
rcon.port                   28016

# ----------------------------------------------------------------------
#  3. UPDATES
# ----------------------------------------------------------------------

#  When Rust and Oxide are updated.
#    auto      As hotwire while the Hotwire plugin has an update scheduled,
#              otherwise as always. Leave it on auto unless you have a
#              reason.
#    always    Every start. Restarts take longer and the server is never
#              behind.
#    hotwire   When the plugin asks, when Steam has a newer build, when the
#              launcher cannot tell whether Steam has one, or after
#              hotwire.max_days_without_update days.
#    off       Never. For a server whose files are managed some other way.
hotwire.update_mode         auto

# ----------------------------------------------------------------------
#  4. MORE SERVER SETTINGS
#     Any Rust convar, by its own name, one per line. The ones below are
#     those people set: each is off (#) and shows the game's default. Remove
#     the # and change the value to use one. Anything else goes at the end,
#     under OTHER CONVARS.
# ----------------------------------------------------------------------

#  -- The Map --------------------------------------------------------------
#     The save folder, seed and world size are in section 1. Changing the
#     level, seed or world size starts a new map, which wipes everything
#     built on the old one. server.randomize_seed picks a new seed on every
#     start, so it belongs in a wipe script, never here.

#  Leave as-is for a generated map. For a custom map use server.levelurl
#  instead.
#                                         [string, default "Procedural Map"]
server.level                "Procedural Map"

#  Custom map URL. Replaces level, seed and worldsize -- do not set both.
#                                                       [string, default ""]
#server.levelurl             ""

#  -- Network --------------------------------------------------------------
#     The player count is in section 1 and the three ports in section 2.
#     Reserve this machine's address in DHCP when you forward the ports: if
#     the lease moves, every forward breaks at once.

#  Bind address. Leave alone unless the machine is multi-homed.
#                                                       [string, default ""]
#server.ip                   ""

#  Seconds of silence before a client is dropped.
#                                                          [int, default 60]
#server.playertimeout        60

#  Seconds a kicked player waits before rejoining.
#                                                         [int, default 300]
#server.rejoin_delay         300

#  -- Browser Listing ------------------------------------------------------
#     What people see before they join. The name, description and tags are in
#     section 1.

#  512x256 banner. Direct image URL, not a page containing one.
#                                                       [string, default ""]
#server.headerimage          ""

#  Server logo. Direct image URL.
#                                                       [string, default ""]
#server.logoimage            ""

#  Website link on the join screen.
#                                                       [string, default ""]
#server.url                  ""

#  -- Admin and RCON -------------------------------------------------------
#     RCON is remote code execution on this machine. The password belongs in
#     hotwire-secrets.cfg and nowhere else.

#  rcon.password is read from hotwire-secrets.cfg, never from here.

#  1 for WebSocket RCON, which is what current tools expect.
#                                                       [bool, default true]
rcon.web                    1

#  Bind address for RCON. Leave alone unless multi-homed.
#                                                       [string, default ""]
#rcon.ip                     ""

#  Player reports appear in the console.
#                                                      [bool, default false]
#server.printReportsToConsole 0

#  -- Saves and Logs -------------------------------------------------------
#     The save interval is how much progress a crash costs everybody, which
#     is why a scheduled restart should quit cleanly rather than kill the
#     process.

#  Seconds between world saves. Lower costs a brief hitch more often.
#                                                         [int, default 600]
#server.saveinterval         600

#  Rolling save backups kept on disk.
#                                                           [int, default 2]
#server.saveBackupCount      2

#  Print chat to the console and log.
#                                                       [bool, default true]
#chat.serverlog              1

#  -- PVE, PVP and Damage --------------------------------------------------
#     server.pve is a blunt server-wide switch and turns off far more than
#     most people expect. Almost every PVE server uses a plugin instead,
#     which can make zones, times or teams behave differently.

#  Server-wide PVE.
#                                                      [bool, default false]
#server.pve                  0

#  Time-to-kill multiplier. Above 1 means players take longer to die.
#                                                       [float, default 1.0]
#server.pvp_ttk_global       1.0

#  Bullet damage multiplier.
#                                                       [float, default 1.0]
#server.bulletdamage         1.0

#  Arrow damage multiplier.
#                                                       [float, default 1.0]
#server.arrowdamage          1.0

#  Radiation zones on or off.
#                                                       [bool, default true]
#server.radiation            1

#  Building stability. Off lets people build things that could not stand up.
#                                                       [bool, default true]
#server.stability            1

#  -- Death and Respawn ----------------------------------------------------

#  Players go down wounded instead of dying outright.
#                                                       [bool, default true]
#server.woundingenabled      1

#  Wounded players can crawl.
#                                                       [bool, default true]
#server.crawlingenabled      1

#  Chance of getting back up without help.
#                                                       [float, default 0.2]
#server.woundedrecoverchance 0.2

#  Drop your inventory on death.
#                                                       [bool, default true]
#server.dropitems            1

#  Leave a lootable corpse.
#                                                       [bool, default true]
#server.corpses              1

#  Respawn where you died.
#                                                      [bool, default false]
#server.respawnAtDeathPosition 0

#  Respawn holding a kit.
#                                                      [bool, default false]
#server.respawnWithLoadout   0

#  -- Despawn Times --------------------------------------------------------
#     Seconds. Raising these leaves more on the ground, which players like
#     and the entity count does not.

#  Dropped items.
#                                                     [float, default 300.0]
#server.itemdespawn          300.0

#  Low-value items, which go sooner.
#                                                      [float, default 30.0]
#server.itemdespawn_quick    30.0

#  Player corpses.
#                                                     [float, default 300.0]
#server.corpsedespawn        300.0

#  NPC corpses.
#                                                     [float, default 600.0]
#server.npccorpsedespawn     600.0

#  Building debris after a raid.
#                                                      [float, default 30.0]
#server.debrisdespawn        30.0

#  -- Decay and Upkeep -----------------------------------------------------

#  Decay rate multiplier. 0 turns decay off entirely, which many modded
#  servers do.
#                                                       [float, default 1.0]
#decay.scale                 1.0

#  Whether tool cupboards consume upkeep at all.
#                                                       [bool, default true]
#decay.upkeep                1

#  Minutes of grace after a cupboard runs dry.
#                                                    [float, default 1440.0]
#decay.upkeep_grief_protection 1440.0

#  -- Chat -----------------------------------------------------------------

#  Chat on or off.
#                                                       [bool, default true]
#chat.enabled                1

#  Everyone hears everyone, anywhere on the map. Off leaves only local chat.
#                                                       [bool, default true]
#chat.globalchat             1

#  Proximity chat.
#                                                      [bool, default false]
#chat.localchat              0

#  Metres that proximity chat carries.
#                                                     [float, default 100.0]
#chat.localChatRange         100.0

#  -- Events ---------------------------------------------------------------
#     server.events is the master switch; the rest tune individual events.

#  Timed world events on or off.
#                                                       [bool, default true]
#server.events               1

#  How long the patrol helicopter stays before leaving.
#                                                      [float, default 30.0]
#patrolhelicopter.lifetimeMinutes 30.0

#  How many guns it fires with.
#                                                           [int, default 1]
#patrolhelicopter.guns       1

#  Its damage multiplier.
#                                                       [float, default 1.0]
#patrolhelicopter.bulletDamageScale 1.0

#  Cargo ship on or off.
#                                                       [bool, default true]
#cargoship.event_enabled     1

#  How long it stays.
#                                                      [float, default 50.0]
#cargoship.event_duration_minutes 50.0

#  Halloween event.
#                                                      [bool, default false]
#halloween.enabled           0

#  Christmas event.
#                                                      [bool, default false]
#xmas.enabled                0

#  -- Spawns and Populations -----------------------------------------------
#     Populations are per square kilometre, so a bigger map means more
#     animals at the same number. The spawn rates and densities scale the
#     whole system at once and go a long way; change them in small steps.

#  Upper bound on spawn rate.
#                                                       [float, default 1.0]
#spawn.max_rate              1.0

#  Lower bound on spawn rate.
#                                                       [float, default 0.5]
#spawn.min_rate              0.5

#  Upper bound on spawn density.
#                                                       [float, default 1.0]
#spawn.max_density           1.0

#  Lower bound on spawn density.
#                                                       [float, default 0.5]
#spawn.min_density           0.5

#  How strongly nearby players suppress spawns.
#                                                       [float, default 2.0]
#spawn.player_scale          2.0

#  Bears.
#                                                       [float, default 2.0]
#bear.Population             2.0

#  Polar bears.
#                                                       [float, default 1.0]
#polarbear.Population        1.0

#  Boar.
#                                                       [float, default 5.0]
#boar.Population             5.0

#  Stags.
#                                                       [float, default 3.0]
#stag.Population             3.0

#  Chickens.
#                                                       [float, default 3.0]
#chicken.Population          3.0

#  Wolves. The class really is Wolf2; Rust replaced the original.
#                                                       [float, default 2.0]
#wolf2.Population            2.0

#  Horses. Note the spelling: ridable, one e.
#                                                       [float, default 2.0]
#ridablehorse.Population     2.0

#  -- Idle Kick ------------------------------------------------------------

#  Minutes of idling before a kick.
#                                                          [int, default 30]
#server.idlekick             30

#  0 never, 1 only when the server is full, 2 always.
#                                                           [int, default 1]
#server.idlekickmode         1

#  -- Rust+ companion app --------------------------------------------------
#     Rust+ needs its own port forward, which is almost always why it does
#     not work.

#  Rust+ port, TCP. 0 derives server.port + 68, so 28083 here.
#                                                     [int, default UNKNOWN]
#app.port                    0

#  Bind address for Rust+.
#                                                       [string, default ""]
#app.listenip                ""

#  -- Performance ----------------------------------------------------------
#     Leave this alone unless you are chasing a problem you have actually
#     measured. Raising the tick rate is the most common thing people try and
#     the least likely to help: it multiplies CPU cost and does nothing for a
#     server that was not CPU-bound to begin with.

#  Server ticks per second.
#                                                          [int, default 10]
#server.tickrate             10

# ----------------------------------------------------------------------
#  5. LAUNCHER SETTINGS
#     How the launcher behaves. Most servers never change these: each is off
#     (#) and shows the value the launcher uses. Remove the # and change the
#     value to use your own.
# ----------------------------------------------------------------------

#  The steamcmd program. Several servers may share one. Off, it is
#  /usr/games/steamcmd on Linux and C:\steamcmd\steamcmd.exe on Windows.
#hotwire.steamcmd                  /usr/games/steamcmd

#  Steam branch: "public" is the live game. Empty lets Steam keep the last
#  one.
#hotwire.steam_branch              public

#  hotwire mode only: update after this many days without one. 0 = never.
#hotwire.max_days_without_update   14

#  Update when Steam has a newer build than the one installed.
#hotwire.update_on_new_build       1

#  Hours to trust a Steam build check. 0 turns the check off.
#hotwire.build_check_hours         6

#  steamcmd attempts before giving up and starting what is on disk.
#hotwire.steam_tries               5

#  Seconds between steamcmd attempts.
#hotwire.steam_retry_seconds       60

#  Minutes to wait for another server's steamcmd run before starting as-is.
#hotwire.steamcmd_wait_minutes     60

#  1 = install and refresh Oxide with the server; 0 = vanilla, never
#  touched.
#hotwire.install_framework         1

#  Skip re-extracting Oxide when neither it nor the game changed.
#hotwire.skip_unchanged_framework  1

#  Check Oxide against the SHA-256 GitHub publishes before extracting.
#hotwire.verify_framework          1

#  1 = start the server again when it exits; 0 = the launcher stops too.
#hotwire.restart_on_exit           1

#  Seconds before starting again (longer after repeated crashes).
#hotwire.restart_delay             15

#  A run shorter than this many seconds counts as a crash.
#hotwire.crash_seconds             60

#  Crashes in a row before the launcher stops. 0 = never stop.
#hotwire.max_crash_streak          10

#  1 = wait longer after repeated crashes (30, 60, 120, 300 seconds).
#hotwire.crash_backoff             1

#  1 = keep each run's log; 0 lets the server overwrite it every start.
#hotwire.rotate_logs               1

#  How many kept logs to keep. Cannot be 0.
#hotwire.log_keep                  14

#  Shortest RCON password allowed. Cannot be 0.
#hotwire.rcon_password_min         8

#  1 = warn about a setting name the launcher does not know.
#hotwire.check_options             1

#  1 = carry out the backups Hotwire asks for; 0 = never back up here.
#hotwire.backups                   1

# ----------------------------------------------------------------------
#  OTHER CONVARS
#     Anything not listed above, by its own name, one per line.
# ----------------------------------------------------------------------
