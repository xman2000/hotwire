# ==[ H O T W I R E ]===================================================
#  hotwire-secrets.cfg -- the RCON password, and nothing else.
#
#  Only if you use an RCON tool. Hotwire does not use RCON, and without
#  a password Rust starts with RCON off. To turn it on, copy this file to
#  hotwire-secrets.cfg beside the launcher, remove the # below and set
#  the password. It takes effect at the next restart.
#
#  The file is read, never run, and never leaves this machine: it is not
#  in backups, and the start-script converter never asks for it.
#  Keep it private: on Linux, chmod 600 hotwire-secrets.cfg.
#
#  At least 8 characters, in double quotes, with no double quote inside.
# ======================================================================

#rcon.password "change_me"
