# ==[ H O T W I R E ]===================================================
#  hotwire.cfg -- your server's settings, read by hotwire.bat or hotwire.sh.
#  One setting per line: a name, a space, then the value. A value with
#  spaces goes in "double quotes", with no double quote inside. # starts a
#  comment. An empty value, or a setting that is off (#), leaves the game's
#  default. This file is only read, never run: "hotwire.bat check" or
#  "./hotwire.sh check" names any line that is not a setting.
#  The RCON password is in hotwire-secrets.cfg. Your own commands go in
#  hotwire-before and hotwire-after (see the .example files).
# ======================================================================

# ==== 1. YOUR SERVER ======================================================
#  The name in the server browser. [default: My Untitled Rust Server]
server.hostname             ""
#  Shown with your server in the browser. \n starts a new line. [default: No
#  server description has been provided.]
server.description          ""
#  Browser filter tags, separated by commas, with no spaces. For example:
#  monthly,vanilla,NA
#    wipe schedule   monthly, biweekly, weekly
#    ruleset         vanilla, softcore, hardcore, primitive, pve
#    style           roleplay, creative, minigame, training, battlefield,
#                    builds
#    region          a region tag, such as NA or EU
server.tags                 ""
#  Player slots. [default: 500]
server.maxplayers           ""
#  The folder under server/ that holds the map, blueprints and bans. Short,
#  lower case, no spaces. Changing it starts a new, empty server and leaves
#  the old one on disk. [default: my_server_identity]
server.identity             ""
#  The map: any whole number from 0 to 2147483647. Changing it wipes the
#  map. [default: 1337]
server.seed                 ""
#  Map width in meters, 1000 to 6000. Bigger maps boot slower and use more
#  memory. Changing it wipes the map. [default: 4500]
server.worldsize            ""

# ==== 2. PORTS ============================================================
#  Forward the game and query ports, never RCON. Each server needs its own
#  three.
#  Game traffic, UDP. [default: 28015]
server.port                 28015
#  Server browser, UDP. If this is wrong the server runs but nobody can see
#  it. Never 27000 to 27030, which is Steam's own range: on a machine that
#  also runs Steam, the client can take the port and hide your server.
#  [default: 0]
server.queryport            28017
#  Remote console, TCP. Never forward this port: RCON is not encrypted, and
#  the password crosses the network in plain text. [default: 0]
rcon.port                   28016

# ==== 3. UPDATES ==========================================================
#  When Rust and Oxide update. auto: as hotwire while the Hotwire plugin has
#  an update scheduled, otherwise as always. always: every start. hotwire:
#  when the plugin asks, Steam has a newer build (or cannot say), or after
#  hotwire.max_days_without_update days. off: never.
hotwire.update_mode         auto

# ==== 4. MORE SERVER SETTINGS =============================================
#  Each is off (#) and shows the game's default. Remove the # and change the
#  value to use one; add anything else at the end.
#  Search (Ctrl+F) for a heading:
#    THE MAP  |  NETWORK  |  BROWSER LISTING  |  ADMIN AND RCON  |
#    SAVES AND LOGS  |  PVE, PVP AND DAMAGE  |  DEATH AND RESPAWN  |
#    DESPAWN TIMES  |  DECAY AND UPKEEP  |  CHAT  |  EVENTS  |
#    ANIMALS AND SPAWNS  |  VEHICLES AND HORSES  |
#    PLAYERS, TEAMS AND CLANS  |  CRAFTING, GATHER AND FARMING  |
#    WIPE TIMER  |  IDLE KICK  |  RUST+ COMPANION APP  |  PERFORMANCE

#  -- THE MAP --------------------------------------------------------------
#  The save folder, seed and world size are in section 1.
#  Leave as-is for a generated map. For a custom map use server.levelurl
#  instead. [string, default "Procedural Map"]
server.level                "Procedural Map"
#  Custom map URL. Replaces level, seed and worldsize -- do not set both.
#server.levelurl             ""

#  -- NETWORK --------------------------------------------------------------
#  The player count is in section 1 and the three ports in section 2.
#  Bind address. Leave alone unless the machine is multi-homed.
#server.ip                   ""
#  Seconds of silence before a client is dropped.
#server.playertimeout        60
#  Seconds a kicked player waits before rejoining.
#server.rejoin_delay         300

#  -- BROWSER LISTING ------------------------------------------------------
#  What people see before they join.
#  512x256 banner. Direct image URL, not a page containing one.
#server.headerimage          ""
#  Server logo. Direct image URL.
#server.logoimage            ""
#  Website link on the join screen.
#server.url                  ""

#  -- ADMIN AND RCON -------------------------------------------------------
#  RCON is remote code execution on this machine.
#  rcon.password is read from hotwire-secrets.cfg, never from here.
#  1 for WebSocket RCON, which is what current tools expect. [bool, default
#  true]
rcon.web                    1
#  Bind address for RCON. Leave alone unless multi-homed.
#rcon.ip                     ""
#  Player reports appear in the console.
#server.printReportsToConsole 0

#  -- SAVES AND LOGS -------------------------------------------------------
#  The save interval is how much progress a crash costs everybody, which is
#  why a scheduled restart should quit cleanly rather than kill the process.
#  Seconds between world saves. Lower costs a brief hitch more often.
#server.saveinterval         600
#  Rolling save backups kept on disk.
#server.saveBackupCount      2
#  Print chat to the console and log.
#chat.serverlog              1

#  -- PVE, PVP AND DAMAGE --------------------------------------------------
#  server.pve is a blunt server-wide switch and turns off far more than most
#  people expect.
#  Server-wide PVE.
#server.pve                  0
#  Time-to-kill multiplier. Above 1 means players take longer to die.
#server.pvp_ttk_global       1.0
#  Bullet damage multiplier.
#server.bulletdamage         1.0
#  Arrow damage multiplier.
#server.arrowdamage          1.0
#  Radiation zones on or off.
#server.radiation            1
#  Building stability. Off lets people build things that could not stand up.
#server.stability            1
#  Melee damage multiplier.
#server.meleedamage          1.0
#  How well armor protects against bullets. Multiplier.
#server.bulletarmor          1.0
#  How well armor protects against arrows. Multiplier.
#server.arrowarmor           1.0
#  How well armor protects against melee. Multiplier.
#server.meleearmor           1.0
#  Extra bullet damage against NPCs and animals only. Stacks with
#  server.bulletdamage.
#server.pvebulletdamagemultiplier 1.0

#  -- DEATH AND RESPAWN ----------------------------------------------------
#  Players go down wounded instead of dying outright.
#server.woundingenabled      1
#  Wounded players can crawl.
#server.crawlingenabled      1
#  Chance of getting back up without help.
#server.woundedrecoverchance 0.2
#  Drop your inventory on death.
#server.dropitems            1
#  Leave a lootable corpse.
#server.corpses              1
#  Respawn where you died.
#server.respawnAtDeathPosition 0
#  Respawn holding a kit.
#server.respawnWithLoadout   0

#  -- DESPAWN TIMES --------------------------------------------------------
#  Seconds.
#  Dropped items.
#server.itemdespawn          300.0
#  Low-value items, which go sooner.
#server.itemdespawn_quick    30.0
#  Player corpses.
#server.corpsedespawn        300.0
#  NPC corpses.
#server.npccorpsedespawn     600.0
#  Building debris after a raid.
#server.debrisdespawn        30.0

#  -- DECAY AND UPKEEP -----------------------------------------------------
#  Decay rate multiplier. 0 turns decay off entirely, which many modded
#  servers do.
#decay.scale                 1.0
#  Whether tool cupboards consume upkeep at all.
#decay.upkeep                1
#  Minutes of grace after a cupboard runs dry.
#decay.upkeep_grief_protection 1440.0
#  Seconds between decay ticks. Lower makes buildings decay in smaller, more
#  frequent steps.
#decay.tick                  600.0
#  How many minutes the upkeep in a tool cupboard pays for.
#decay.upkeep_period_minutes 1440.0
#  How fast buildings heal while upkeep is paid. 1 is the rate they decay
#  at.
#decay.upkeep_heal_scale     1.0
#  How fast parts of a base decay when they are inside it.
#decay.upkeep_inside_decay_scale 0.1
#  Hours for twig to decay away without upkeep.
#decay.duration_twig         1.0
#  Hours for wood to decay away without upkeep.
#decay.duration_wood         3.0
#  Hours for stone to decay away without upkeep.
#decay.duration_stone        5.0
#  Hours for sheet metal to decay away without upkeep.
#decay.duration_metal        8.0
#  Hours for armored (HQM) to decay away without upkeep.
#decay.duration_toptier      12.0
#  Above 0, every grade takes this many hours to decay away.
#decay.duration_override     0.0
#  Hours before unprotected twig starts to decay.
#decay.delay_twig            0.0
#  Hours before unprotected wood starts to decay.
#decay.delay_wood            0.0
#  Hours before unprotected stone starts to decay.
#decay.delay_stone           0.0
#  Hours before unprotected sheet metal starts to decay.
#decay.delay_metal           0.0
#  Hours before unprotected armored (HQM) starts to decay.
#decay.delay_toptier         0.0
#  Above 0, every grade waits this many hours before it decays.
#decay.delay_override        0.0
#  Upkeep scale for high external walls and gates.
#decay.high_wall_upkeep      0.2
#  Upkeep costs more with more players authorized on the cupboard.
#decay.upkeep_group_scaling  1
#  The most that group scaling can multiply upkeep by.
#decay.upkeep_group_max_multiplier 3.0
#  Players can upgrade building blocks to stone.
#decay.upgrade_stone_enabled 1
#  Players can upgrade building blocks to sheet metal.
#decay.upgrade_metal_enabled 1
#  Players can upgrade building blocks to armored (HQM).
#decay.upgrade_hqm_enabled   1

#  -- CHAT -----------------------------------------------------------------
#  Chat on or off.
#chat.enabled                1
#  Everyone hears everyone, anywhere on the map. Off leaves only local chat.
#chat.globalchat             1
#  Proximity chat.
#chat.localchat              0
#  Metres that proximity chat carries.
#chat.localChatRange         100.0

