#  -- WIPE TIMER -----------------------------------------------------------
#  What the in-game wipe countdown shows.
#  Wipe day: 0 Sunday, 1 Monday ... 4 Thursday ... 6 Saturday.
#wipetimer.wipedayofweek     4
#  Wipe hour: 14.5 is 2:30 pm.
#wipetimer.wipehourofday     19.0
#  Time zone for the wipe hour, such as America/Chicago.
#wipetimer.wipetimezone      "Europe/London"
#  A cron expression for the wipe schedule. Overrides the settings above.
#wipetimer.wipecronoverride  ""

#  -- IDLE KICK ------------------------------------------------------------
#  Minutes of idling before a kick.
#server.idlekick             30
#  0 never, 1 only when the server is full, 2 always.
#server.idlekickmode         1

#  -- RUST+ COMPANION APP --------------------------------------------------
#  Rust+ needs its own port forward, which is almost always why it does not
#  work.
#  Rust+ port, TCP. Unset, it is the larger of server.port and rcon.port,
#  plus 67: 28083 with the ports above. It must be 10000 or higher.
#app.port                    ""
#  Bind address for Rust+.
#app.listenip                ""

#  -- PERFORMANCE ----------------------------------------------------------
#  Leave this alone unless you have measured a problem it would fix.
#  Server ticks per second.
#server.tickrate             10

# ==== 5. LAUNCHER SETTINGS ================================================
#  How the launcher behaves. Each is off (#) and shows the value it uses.
#  The steamcmd program. Several servers may share one. Off, it is
#  /usr/games/steamcmd on Linux and C:\steamcmd\steamcmd.exe on Windows.
#hotwire.steamcmd                  /usr/games/steamcmd
#  Steam branch: "public" is the live game. Empty lets Steam keep the last
#  one.
#hotwire.steam_branch              public
#  hotwire mode only: update after this many days without one. 0 = never.
#hotwire.max_days_without_update   14
#  Update when Steam has a newer build than the one installed.
#hotwire.update_on_new_build       1
#  Launchers 1.1.19 and 1.1.7-linux. 1 = before an update to a newer Rust
#  build, mark the game files for Steam's full check, so a server with
#  Oxide updates in one try instead of two. It changes a Steam file that
#  Valve does not document. 0 = Steam's usual update.
#hotwire.fast_rust_updates         0
#  Launchers 1.1.19 and 1.1.7-linux. 1 = when Steam no longer serves the
#  installed Rust build's file list, set Steam's install record aside and
#  update again. 0 = start the installed build.
#hotwire.recover_refused_update    1
#  Hours to trust a Steam build check. 0 turns the check off.
#hotwire.build_check_hours         6
#  steamcmd attempts before giving up and starting what is on disk.
#hotwire.steam_tries               5
#  Seconds between steamcmd attempts.
#hotwire.steam_retry_seconds       60
#  Minutes to wait for another server's steamcmd run before starting as-is.
#hotwire.steamcmd_wait_minutes     60
#  Launchers 1.1.27 (Windows) and 1.1.12-linux: the longest one steamcmd update may
#  run. Past it steamcmd is stopped and what is on disk starts; the next update carries
#  on from what was downloaded. 0 = no limit.
#hotwire.steamcmd_update_minutes   60
#  Launchers 1.1.20 (Windows) and 1.1.6-linux: when a forced wipe waits on the update, keep
#  trying steamcmd this many minutes before starting what is on disk. 0 = only
#  hotwire.steam_tries.
#hotwire.forced_wipe_steam_minutes  15
#  1 = install and refresh Oxide with the server; 0 = vanilla, never
#  touched.
#hotwire.install_framework         1
#  Skip re-extracting Oxide when neither it nor the game changed.
#hotwire.skip_unchanged_framework  1
#  Check Oxide against the SHA-256 GitHub publishes before extracting.
#hotwire.verify_framework          1
#  1 = start the server again when it exits; 0 = the launcher stops too.
#hotwire.restart_on_exit           1
#  Seconds before starting again (longer after repeated crashes).
#hotwire.restart_delay             15
#  A run shorter than this many seconds counts as a crash.
#hotwire.crash_seconds             60
#  Crashes in a row before the launcher stops. 0 = never stop.
#hotwire.max_crash_streak          10
#  1 = wait longer after repeated crashes (30, 60, 120, 300 seconds).
#hotwire.crash_backoff             1
#  Linux, launcher 1.1.13-linux or later. When the server is stopped (systemctl stop, a reboot),
#  seconds Hotwire has to answer the request to save and quit.
#hotwire.stop_ask_seconds          5
#  Linux, launcher 1.1.13-linux or later. Seconds the save and quit may take before Rust is
#  stopped anyway.
#hotwire.stop_save_seconds         90
#  1 = keep each run's log; 0 lets the server overwrite it every start.
#hotwire.rotate_logs               1
#  How many rotated logs to keep. Cannot be 0.
#hotwire.log_keep                  14
#  Shortest RCON password allowed. Cannot be 0.
#hotwire.rcon_password_min         8
#  1 = warn about a setting name the launcher does not know.
#hotwire.check_options             1
#  1 = carry out the backups Hotwire asks for; 0 = never back up here.
#hotwire.backups                   1

# ==== OTHER CONVARS =======================================================
