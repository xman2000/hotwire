#patrolhelicopter.bulletDamageScale 1.0
#  Cargo ship on or off.
#cargoship.event_enabled     1
#  How long it stays.
#cargoship.event_duration_minutes 50.0
#  Halloween event.
#halloween.enabled           0
#  Christmas event.
#xmas.enabled                0
#  The Bradley APC at Launch Site. Off stops it spawning.
#bradley.enabled             1
