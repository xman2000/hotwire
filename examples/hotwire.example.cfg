#patrolhelicopter.bulletaccuracy 2.0
#  The Travelling Vendor on the ring road.
#travellingvendor.should_spawn 1
#  Seconds before the Travelling Vendor leaves.
#travellingvendor.alive_time_seconds 1800.0
#  Seconds a locked crate takes to hack.
#hackablelockedcrate.requiredhackseconds 900.0
