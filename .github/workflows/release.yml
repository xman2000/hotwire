# A release: push a tag, and GitHub builds the files from that commit and publishes them as a release.
#
# The files are what afkpanel.com/get/ sends people to (its links redirect here), so the bytes an admin downloads come
# from this repository, never from the panel's server. tools/build-release.sh refuses to build until AFKPanel's list of
# released files holds this commit's files, because setup checks every download against that list. The tests run first,
# on the tagged commit: a tag on a commit that fails them publishes nothing.
name: Release

on:
  push:
    tags: ['release-*']

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Every tag, so the notes can list what changed since the previous release.
          fetch-depth: 0

      - name: Build the release files
        env:
          TAG: ${{ github.ref_name }}
        run: tools/build-release.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          plugin=$(grep -oP 'Info\("Hotwire", "xman2000", "\K[0-9.]+' plugin/Hotwire.cs)
          previous=$(git describe --tags --abbrev=0 --match 'release-*' "${TAG}^" 2>/dev/null || true)
          {
            echo "Plugin ${plugin}. Download and install: https://afkpanel.com/get-started"
            echo
            echo "## What changed"
            echo
            if [ -n "$previous" ]; then
              # The changelog lines added since the previous release, as written there.
              git diff --unified=0 "$previous" HEAD -- CHANGELOG.md | sed -n 's/^+\([^+]\)/\1/p; s/^+$//p' | sed 's/ — unreleased$//'
            else
              echo "See CHANGELOG.md at this tag."
            fi
            echo
            echo "Watch your server from any browser with [AFKPanel](https://afkpanel.com): [Get started](https://afkpanel.com/get-started) · [Documentation](https://afkpanel.com/docs) · [Pricing](https://afkpanel.com/pricing)"
            echo
            echo 'SHA-256:'
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > dist/notes.md
          gh release create "$TAG" dist/hotwire-windows.zip dist/hotwire-linux.zip dist/hotwire-setup.sh dist/Hotwire.cs dist/SHA256SUMS \
            --title "$TAG" --notes-file dist/notes.md --latest
